<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen de Pedido</title>
    <style>
        /* CSS Optimizado para móviles */
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .contenedor-resumen { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h1 { text-align: center; color: #333; font-size: 1.5rem; }
        
        .item-pedido { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 0.95rem; gap: 10px; }
        .info-producto { flex-grow: 1; }
        
        /* Controles horizontales al lado del producto */
        .acciones-item { display: flex; align-items: center; gap: 6px; }
        .btn-cant { background: #ff4500; color: white; border: none; width: 28px; height: 28px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .cantidad-num { font-weight: bold; min-width: 25px; text-align: center; }
        .btn-eliminar-item { background: #ffecec; color: #ff4d4d; border: none; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; }
        
        #total-final { text-align: right; font-size: 1.3rem; margin: 20px 0; color: #ff4500; font-weight: bold; }
        
        /* Botones principales */
        .btn { width: 100%; padding: 18px; margin-bottom: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; text-align: center; display: block; text-decoration: none; box-sizing: border-box; font-size: 1rem; }
        .btn-wsp { background: #25d366; color: white; }
        .btn-volver { background: #e0e0e0; color: #333; }
        .btn-limpiar { background: #ffecec; color: #ff4d4d; }
    </style>
</head>
<body onload="cargarPedido()">

    <div class="contenedor-resumen">
        <h1>Resumen de tu pedido</h1>
        
        <div id="lista-productos"></div>
        <h2 id="total-final">Total: $0</h2>
        
        <button class="btn btn-wsp" onclick="enviarWhatsApp()">Enviar Pedido por WhatsApp 📲</button>
        <a href="productos.html" class="btn btn-volver">← Volver al Catálogo</a>
        <button class="btn btn-limpiar" onclick="limpiarCarrito()">🗑️ Limpiar todo el carrito</button>
    </div>

    <script>
        function cargarPedido() {
            let datos = localStorage.getItem('miPedido');
            let contenedor = document.getElementById('lista-productos');

            if (!datos || JSON.parse(datos).length === 0) {
                contenedor.innerHTML = "<p style='text-align:center;'>Tu carrito está vacío.</p>";
                document.getElementById('total-final').innerText = "Total: $0";
                localStorage.setItem('totalFinal', 0);
            } else {
                let pedido = JSON.parse(datos);
                let nuevoTotal = 0;

                contenedor.innerHTML = pedido.map((p, index) => {
                    let subtotal = parseInt(p.precio) * p.cantidad;
                    nuevoTotal += subtotal;
                    return `
                        <div class="item-pedido">
                            <div class="info-producto">
                                <strong>${p.nombre}</strong><br>
                                <span style="color: #666; font-size: 0.85rem;">$${subtotal.toLocaleString('es-CO')}</span>
                            </div>
                            <div class="acciones-item">
                                <button class="btn-cant" onclick="cambiarCantidad(${index}, -1)">-</button>
                                <span class="cantidad-num">${p.cantidad}</span>
                                <button class="btn-cant" onclick="cambiarCantidad(${index}, 1)">+</button>
                                <button class="btn-eliminar-item" onclick="eliminarItem(${index})" title="Eliminar">🗑️</button>
                            </div>
                        </div>
                    `;
                }).join('');

                localStorage.setItem('totalFinal', nuevoTotal);
                document.getElementById('total-final').innerText = "Total: $" + nuevoTotal.toLocaleString('es-CO');
            }
        }

        function cambiarCantidad(index, cambio) {
            let pedido = JSON.parse(localStorage.getItem('miPedido')) || [];
            let p = pedido[index];
            
            // Verificamos si permite mitad (soporta booleano true o si viene como texto "true")
            let esDeMitad = (p.permitemitad === true || p.permitemitad === "true");
            
            let cantidadActual = parseFloat(p.cantidad) || 0;
            let nuevaCantidad = cantidadActual;

            if (esDeMitad) {
                // Si permite mitad, el salto es estrictamente de 0.5 en 0.5 por cada clic en + o -
                if (cambio > 0) {
                    nuevaCantidad = cantidadActual + 0.5;
                } else {
                    nuevaCantidad = cantidadActual - 0.5;
                }
            } else {
                // Si es paca entera normal, el salto es de 1 en 1 (1 -> 2 -> 3...)
                if (cambio > 0) {
                    nuevaCantidad = cantidadActual + 1;
                } else {
                    nuevaCantidad = cantidadActual - 1;
                }
            }
            
            // Limpieza de decimales fantasma de JavaScript
            nuevaCantidad = Math.round(nuevaCantidad * 10) / 10;
            
            // Si llega a 0 o menos, eliminamos el ítem
            if (nuevaCantidad <= 0) {
                pedido.splice(index, 1);
            } else {
                pedido[index].cantidad = nuevaCantidad;
            }
            
            localStorage.setItem('miPedido', JSON.stringify(pedido));
            cargarPedido();
        }

        function eliminarItem(index) {
            let pedido = JSON.parse(localStorage.getItem('miPedido')) || [];
            pedido.splice(index, 1);
            localStorage.setItem('miPedido', JSON.stringify(pedido));
            cargarPedido();
        }

        function limpiarCarrito() {
            if (confirm("¿Borrar todo el pedido?")) {
                localStorage.removeItem('miPedido');
                localStorage.removeItem('totalFinal');
                cargarPedido();
            }
        }

        function enviarWhatsApp() {
            let pedido = JSON.parse(localStorage.getItem('miPedido'));
            let total = localStorage.getItem('totalFinal');
            
            if(!pedido || pedido.length === 0) return alert("El carrito está vacío");

            let mensaje = "Hola Distribuidora El Sol! \nQuisiera realizar el siguiente pedido:\n\n";
            pedido.forEach(p => {
                let subtotal = p.precio * p.cantidad;
                mensaje += "*" + p.nombre + "*\n";
                mensaje += "Cant: " + p.cantidad + " - Sub: $" + subtotal.toLocaleString('es-CO') + "\n\n";
            });

            mensaje += "TOTAL A PAGAR: $" + parseInt(total).toLocaleString('es-CO');
            window.location.href = "https://wa.me/573505377054?text=" + encodeURIComponent(mensaje);
        }
    </script>
</body>
</html>
